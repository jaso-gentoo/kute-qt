  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-7zip

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Deploy Qt DLLs
        run: |
          mkdir -p dist
          cp build/kute.exe dist/
          windeployqt --release --no-translations --qmldir qml dist/kute.exe || true
          cp /ucrt64/bin/*.dll dist/

          rm -f dist/ggml*.dll
          rm -f dist/libllama*.dll
          rm -f dist/libmtmd*.dll
          rm -f dist/libwhisper*.dll
          rm -f dist/libparakeet*.dll
          rm -f dist/libpython*.dll
          rm -f dist/libPyImath*.dll
          rm -f dist/libopenblas*.dll
          rm -f dist/libgfortran*.dll
          rm -f dist/libquadmath*.dll
          rm -f dist/libgomp*.dll
          rm -f dist/tcl86.dll
          rm -f dist/tk86.dll
          rm -f dist/libhwy*.dll
          rm -f dist/libcaca*.dll
          rm -f dist/libImath*.dll
          rm -f dist/libIex*.dll
          rm -f dist/libIlmThread*.dll
          rm -f dist/libOpenEXR*.dll
          rm -f dist/libjxl*.dll
          rm -f dist/libmenuw6.dll
          rm -f dist/libformw6.dll
          rm -f dist/libpanelw6.dll
          rm -f dist/libncurses*.dll
          rm -f dist/vulkan-1.dll
          rm -f dist/OpenCL.dll

          echo "--- dist ---"
          ls dist/ | wc -l
          du -sh dist/

      - name: Pack dist to zip
        run: |
          cd dist
          7z a -mx=9 ../dist.zip .
          cd ..
          ls -la dist.zip

      - name: Build launcher.exe
        run: |
          gcc -O2 -s -mwindows packaging/launcher.c -o launcher.exe -lshell32 -luser32
          ls -la launcher.exe

      - name: Build single-file exe with IExpress
        shell: pwsh
        run: |
          $dir = (Get-Location).Path.Replace('\', '\\')

          if (-not (Test-Path "launcher.exe")) { Write-Error "launcher.exe not found"; exit 1 }
          if (-not (Test-Path "dist.zip"))     { Write-Error "dist.zip not found"; exit 1 }

          $sed = @"
          [Version]
          Class=IEXPRESS
          SEDVersion=3
          [Options]
          PackagePurpose=InstallApp
          ShowInstallProgramWindow=0
          HideExtractAnimation=1
          UseLongFileName=1
          InsideCompressed=0
          CAB_FixedSize=0
          CAB_ResvCodeSigning=0
          RebootMode=N
          InstallPrompt=
          DisplayLicense=
          FinishMessage=
          TargetName=$dir\kute-windows-x64.exe
          FriendlyName=kute
          AppLaunched=launcher.exe
          PostInstallCmd=<None>
          AdminQuietInstCmd=
          UserQuietInstCmd=
          SourceFiles=SourceFiles
          [Strings]
          FILE0="launcher.exe"
          FILE1="dist.zip"
          [SourceFiles]
          SourceFiles0=$dir\\
          [SourceFiles0]
          %FILE0%=
          %FILE1%=
          "@

          $sed = ($sed -split "`r?`n" | Where-Object { $_ -ne "" -and $_ -notmatch '^\s+$' }) -join "`r`n"
          Set-Content -Path "kute.sed" -Value $sed -Encoding ASCII -NoNewline

          $iexpress = "$env:SystemRoot\System32\iexpress.exe"
          $proc = Start-Process -FilePath $iexpress -ArgumentList "/N","kute.sed" -Wait -PassThru
          Write-Host "IExpress exit code: $($proc.ExitCode)"
          Start-Sleep -Seconds 5

          if (Test-Path "kute-windows-x64.exe") {
            Get-Item "kute-windows-x64.exe" | Format-List Name, Length
          } else {
            Get-ChildItem | Format-Table Name, Length
            Write-Error "kute-windows-x64.exe was NOT created"
            exit 1
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: kute-windows-x64.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
