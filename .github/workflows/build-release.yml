name: Build Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libtag1-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev \
            cmake ninja-build patchelf desktop-file-utils \
            libfuse2 wget file

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

      - name: Build
        run: cmake --build build

      - name: Install to AppDir
        run: DESTDIR=$PWD/AppDir cmake --install build

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Bundle Qt Wayland plugins and libs
        run: |
          QTDIR="${QT_ROOT_DIR:-$Qt6_DIR/../../..}"
          mkdir -p AppDir/usr/plugins/platforms
          mkdir -p AppDir/usr/plugins/wayland-shell-integration
          mkdir -p AppDir/usr/plugins/wayland-decoration-client
          mkdir -p AppDir/usr/plugins/wayland-graphics-integration-client
          mkdir -p AppDir/usr/lib

          cp -v "$QTDIR"/plugins/platforms/libqwayland*.so AppDir/usr/plugins/platforms/
          cp -v "$QTDIR"/plugins/wayland-shell-integration/*.so \
                AppDir/usr/plugins/wayland-shell-integration/ 2>/dev/null || true
          cp -v "$QTDIR"/plugins/wayland-decoration-client/*.so \
                AppDir/usr/plugins/wayland-decoration-client/ 2>/dev/null || true
          cp -v "$QTDIR"/plugins/wayland-graphics-integration-client/*.so \
                AppDir/usr/plugins/wayland-graphics-integration-client/ 2>/dev/null || true
          cp -v "$QTDIR"/lib/libQt6Wayland*.so* AppDir/usr/lib/

      - name: Fill AppDir with linuxdeploy
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
          EXTRA_QT_MODULES: "multimedia;dbus"
        run: |
          QTDIR="${QT_ROOT_DIR:-$Qt6_DIR/../../..}"
          export LD_LIBRARY_PATH="$QTDIR/lib:$LD_LIBRARY_PATH"
          export PATH="$QTDIR/bin:$PATH"

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --desktop-file AppDir/usr/share/applications/kute.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/kute.png

          rm -f AppDir/usr/lib/libwayland-client.so*  || true
          rm -f AppDir/usr/lib/libwayland-cursor.so*  || true
          rm -f AppDir/usr/lib/libwayland-egl.so*     || true
          rm -f AppDir/usr/lib/libwayland-server.so*  || true
          rm -f AppDir/usr/lib/libxkbcommon.so*       || true
          rm -f AppDir/usr/lib/libxkbcommon-x11.so*   || true
          rm -f AppDir/usr/lib/libEGL.so*             || true
          rm -f AppDir/usr/lib/libGL.so*              || true
          rm -f AppDir/usr/lib/libGLX.so*             || true
          rm -f AppDir/usr/lib/libGLdispatch.so*      || true
          rm -f AppDir/usr/lib/libvulkan.so*          || true
          rm -f AppDir/usr/lib/libpulse.so*           || true
          rm -f AppDir/usr/lib/libpulsecommon*.so     || true

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir kute-x86_64.AppImage
          ls -la kute-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: kute-x86_64.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-taglib

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Deploy Qt DLLs
        run: |
          mkdir -p dist
          cp build/kute.exe dist/
          windeployqt --release --no-translations --qmldir qml dist/kute.exe || true
          cp /ucrt64/bin/*.dll dist/

          rm -f dist/ggml*.dll
          rm -f dist/libllama*.dll
          rm -f dist/libmtmd*.dll
          rm -f dist/libwhisper*.dll
          rm -f dist/libparakeet*.dll
          rm -f dist/libpython*.dll
          rm -f dist/libPyImath*.dll
          rm -f dist/libopenblas*.dll
          rm -f dist/libgfortran*.dll
          rm -f dist/libquadmath*.dll
          rm -f dist/libgomp*.dll
          rm -f dist/tcl86.dll
          rm -f dist/tk86.dll
          rm -f dist/libhwy*.dll
          rm -f dist/libcaca*.dll
          rm -f dist/libImath*.dll
          rm -f dist/libIex*.dll
          rm -f dist/libIlmThread*.dll
          rm -f dist/libOpenEXR*.dll
          rm -f dist/libjxl*.dll
          rm -f dist/libmenuw6.dll
          rm -f dist/libformw6.dll
          rm -f dist/libpanelw6.dll
          rm -f dist/libncurses*.dll
          rm -f dist/vulkan-1.dll
          rm -f dist/OpenCL.dll

          echo "--- dist ---"
          ls dist/ | wc -l
          du -sh dist/

      - name: Build single exe with NSIS
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe"
          )
          $nsis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) {
            Write-Error "NSIS not found at any known location"
            exit 1
          }
          Write-Host "Using NSIS: $nsis"

          $nsi = @'
          Unicode true
          SilentInstall silent
          RequestExecutionLevel user
          OutFile "kute-windows-x64.exe"
          InstallDir "$TEMP\kute"

          Section
            InitPluginsDir
            SetOutPath $PLUGINSDIR
            File /r "dist\*"
            ExecWait '"$PLUGINSDIR\kute.exe"'
          SectionEnd
          '@

          Set-Content -Path "kute.nsi" -Value $nsi -Encoding ASCII
          & $nsis "kute.nsi"

          if (-not (Test-Path "kute-windows-x64.exe")) {
            Write-Error "kute-windows-x64.exe was NOT created"
            exit 1
          }
          Get-Item "kute-windows-x64.exe" | Format-List Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: kute-windows-x64.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}name: Build Release

