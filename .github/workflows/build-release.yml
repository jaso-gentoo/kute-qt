name: Build Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libtag1-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev \
            cmake ninja-build patchelf desktop-file-utils \
            libfuse2 wget file

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

      - name: Build
        run: cmake --build build

      - name: Install to AppDir
        run: DESTDIR=$PWD/AppDir cmake --install build

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Bundle Qt Wayland plugins and libs
        run: |
          QTDIR="${QT_ROOT_DIR:-$Qt6_DIR/../../..}"
          mkdir -p AppDir/usr/plugins/platforms
          mkdir -p AppDir/usr/plugins/wayland-shell-integration
          mkdir -p AppDir/usr/plugins/wayland-decoration-client
          mkdir -p AppDir/usr/plugins/wayland-graphics-integration-client
          mkdir -p AppDir/usr/lib

          cp -v "$QTDIR"/plugins/platforms/libqwayland*.so AppDir/usr/plugins/platforms/
          cp -v "$QTDIR"/plugins/wayland-shell-integration/*.so \
                AppDir/usr/plugins/wayland-shell-integration/ 2>/dev/null || true
          cp -v "$QTDIR"/plugins/wayland-decoration-client/*.so \
                AppDir/usr/plugins/wayland-decoration-client/ 2>/dev/null || true
          cp -v "$QTDIR"/plugins/wayland-graphics-integration-client/*.so \
                AppDir/usr/plugins/wayland-graphics-integration-client/ 2>/dev/null || true
          cp -v "$QTDIR"/lib/libQt6Wayland*.so* AppDir/usr/lib/

      - name: Fill AppDir with linuxdeploy
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
          EXTRA_QT_MODULES: "multimedia;dbus"
        run: |
          QTDIR="${QT_ROOT_DIR:-$Qt6_DIR/../../..}"
          export LD_LIBRARY_PATH="$QTDIR/lib:$LD_LIBRARY_PATH"
          export PATH="$QTDIR/bin:$PATH"

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --desktop-file AppDir/usr/share/applications/kute.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/kute.png

          rm -f AppDir/usr/lib/libwayland-client.so*  || true
          rm -f AppDir/usr/lib/libwayland-cursor.so*  || true
          rm -f AppDir/usr/lib/libwayland-egl.so*     || true
          rm -f AppDir/usr/lib/libwayland-server.so*  || true
          rm -f AppDir/usr/lib/libxkbcommon.so*       || true
          rm -f AppDir/usr/lib/libxkbcommon-x11.so*   || true
          rm -f AppDir/usr/lib/libEGL.so*             || true
          rm -f AppDir/usr/lib/libGL.so*              || true
          rm -f AppDir/usr/lib/libGLX.so*             || true
          rm -f AppDir/usr/lib/libGLdispatch.so*      || true
          rm -f AppDir/usr/lib/libvulkan.so*          || true
          rm -f AppDir/usr/lib/libpulse.so*           || true
          rm -f AppDir/usr/lib/libpulsecommon*.so     || true

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir kute-x86_64.AppImage
          ls -la kute-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: kute-x86_64.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-7zip

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Deploy Qt DLLs
        run: |
          mkdir -p dist
          cp build/kute.exe dist/
          windeployqt --release --no-translations --qmldir qml dist/kute.exe || true
          for dll in \
            libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll \
            libbrotlicommon.dll libbrotlidec.dll libbrotlienc.dll \
            libbz2-1.dll libzstd.dll liblzma-5.dll libdouble-conversion.dll \
            libpcre2-8-0.dll libpcre2-16-0.dll libpcre2-32-0.dll \
            libpng16-16.dll zlib1.dll libfreetype-6.dll libharfbuzz-0.dll \
            libmd4c.dll libmd4c-html.dll libssl-3-x64.dll libcrypto-3-x64.dll \
            libtag-2.dll libtag_c-2.dll \
            avcodec-63.dll avformat-63.dll avutil-61.dll swresample-7.dll swscale-10.dll \
            libiconv-2.dll libintl-8.dll libglib-2.0-0.dll libgobject-2.0-0.dll \
            libgraphite2.dll libffi-8.dll libexpat-1.dll libb2-1.dll \
            libsqlite3-0.dll libnghttp2-14.dll libssh2-1.dll libpsl-5.dll \
            libidn2-0.dll libunistring-5.dll libtasn1-6.dll libhogweed-7.dll \
            libnettle-9.dll libgmp-10.dll libgnutls-30.dll libp11-kit-0.dll \
            libjpeg-8.dll libwebp-7.dll libtiff-6.dll liblcms2-2.dll \
            libx264-165.dll libx265-217.dll libvpx-1.dll libmp3lame-0.dll \
            libopus-0.dll libvorbis-0.dll libvorbisenc-2.dll libogg-0.dll \
            libtheora-1.dll libtheoraenc-2.dll libtheoradec-2.dll \
            libicudt78.dll libicuin78.dll libicuuc78.dll \
            libicutu78.dll libicuio78.dll \
          ; do
            cp "/ucrt64/bin/$dll" dist/ 2>/dev/null || true
          done

          # КРИТИЧНО: убрать стаб vulkan-1.dll, если windeployqt его затащил.
          rm -f dist/vulkan-1.dll || true

          echo "--- dist ---"
          ls dist/ | wc -l
          du -sh dist/
          echo "--- vulkan check (должно быть пусто) ---"
          ls dist/ | grep -i vulkan || echo "ok"

      - name: Pack dist to zip
        run: |
          cd dist
          7z a -mx=9 ../dist.zip .
          cd ..
          ls -la dist.zip

      - name: Create launcher command
        shell: cmd
        run: |
          (
            echo @echo off
            echo setlocal
            echo set "TMPDIR=%%TEMP%%\kute_%%RANDOM%%%%RANDOM%%"
            echo mkdir "%%TMPDIR%%" 2^>nul
            echo powershell -NoProfile -Command "Expand-Archive -Path '%%~dp0dist.zip' -DestinationPath '%%TMPDIR%%' -Force"
            echo start "" "%%TMPDIR%%\kute.exe"
            echo exit /b 0
          ) > launcher.cmd
          type launcher.cmd

      - name: Build single-file exe with IExpress
        shell: pwsh
        run: |
          $dir = (Get-Location).Path.Replace('\', '\\')
          Write-Host "Working dir: $dir"

          if (-not (Test-Path "launcher.cmd")) { Write-Error "launcher.cmd not found"; exit 1 }
          if (-not (Test-Path "dist.zip"))     { Write-Error "dist.zip not found"; exit 1 }

          $sed = @"
          [Version]
          Class=IEXPRESS
          SEDVersion=3
          [Options]
          PackagePurpose=InstallApp
          ShowInstallProgramWindow=0
          HideExtractAnimation=0
          UseLongFileName=1
          InsideCompressed=0
          CAB_FixedSize=0
          CAB_ResvCodeSigning=0
          RebootMode=N
          InstallPrompt=
          DisplayLicense=
          FinishMessage=
          TargetName=$dir\kute-windows-x64.exe
          FriendlyName=kute
          AppLaunched=launcher.cmd
          PostInstallCmd=<None>
          AdminQuietInstCmd=
          UserQuietInstCmd=
          SourceFiles=SourceFiles
          [Strings]
          FILE0="launcher.cmd"
          FILE1="dist.zip"
          [SourceFiles]
          SourceFiles0=$dir\\
          [SourceFiles0]
          %FILE0%=
          %FILE1%=
          "@

          $sed = ($sed -split "`r?`n" | Where-Object { $_ -ne "" -and $_ -notmatch '^\s+$' }) -join "`r`n"
          Set-Content -Path "kute.sed" -Value $sed -Encoding ASCII -NoNewline
          Get-Content kute.sed

          $iexpress = "$env:SystemRoot\System32\iexpress.exe"
          $proc = Start-Process -FilePath $iexpress -ArgumentList "/N","kute.sed" -Wait -PassThru
          Write-Host "IExpress exit code: $($proc.ExitCode)"
          Start-Sleep -Seconds 5

          if (Test-Path "kute-windows-x64.exe") {
            Write-Host "=== SUCCESS ==="
            Get-Item "kute-windows-x64.exe" | Format-List Name, Length
          } else {
            Write-Host "=== Files in dir ==="
            Get-ChildItem | Format-Table Name, Length
            Write-Error "kute-windows-x64.exe was NOT created"
            exit 1
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: kute-windows-x64.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
