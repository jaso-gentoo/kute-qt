name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libtag1-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev \
            cmake ninja-build patchelf desktop-file-utils \
            libfuse2 wget curl file

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

      - name: Build
        run: cmake --build build

      - name: Install to AppDir
        run: DESTDIR=$PWD/AppDir cmake --install build

      - name: Download linuxdeploy
        run: |
          set -e
          for i in 1 2 3; do
            curl -fL --retry 5 --retry-delay 3 --retry-connrefused \
              -o linuxdeploy-x86_64.AppImage \
              "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" && break || sleep 5
          done
          for i in 1 2 3; do
            curl -fL --retry 5 --retry-delay 3 --retry-connrefused \
              -o linuxdeploy-plugin-qt-x86_64.AppImage \
              "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage" && break || sleep 5
          done
          test -s linuxdeploy-x86_64.AppImage
          test -s linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Bundle Qt Wayland plugins and libs
        run: |
          QTDIR="${QT_ROOT_DIR:-$Qt6_DIR/../../..}"
          mkdir -p AppDir/usr/plugins/platforms
          mkdir -p AppDir/usr/plugins/wayland-shell-integration
          mkdir -p AppDir/usr/plugins/wayland-decoration-client
          mkdir -p AppDir/usr/plugins/wayland-graphics-integration-client
          mkdir -p AppDir/usr/lib

          cp -v "$QTDIR"/plugins/platforms/libqwayland*.so AppDir/usr/plugins/platforms/
          cp -v "$QTDIR"/plugins/wayland-shell-integration/*.so \
                AppDir/usr/plugins/wayland-shell-integration/ 2>/dev/null || true
          cp -v "$QTDIR"/plugins/wayland-decoration-client/*.so \
                AppDir/usr/plugins/wayland-decoration-client/ 2>/dev/null || true
          cp -v "$QTDIR"/plugins/wayland-graphics-integration-client/*.so \
                AppDir/usr/plugins/wayland-graphics-integration-client/ 2>/dev/null || true
          cp -v "$QTDIR"/lib/libQt6Wayland*.so* AppDir/usr/lib/

      - name: Fill AppDir with linuxdeploy
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
          EXTRA_QT_MODULES: "multimedia;dbus"
        run: |
          QTDIR="${QT_ROOT_DIR:-$Qt6_DIR/../../..}"
          export LD_LIBRARY_PATH="$QTDIR/lib:$LD_LIBRARY_PATH"
          export PATH="$QTDIR/bin:$PATH"

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --desktop-file AppDir/usr/share/applications/kute.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/kute.png

          rm -f AppDir/usr/lib/libwayland-client.so*  || true
          rm -f AppDir/usr/lib/libwayland-cursor.so*  || true
          rm -f AppDir/usr/lib/libwayland-egl.so*     || true
          rm -f AppDir/usr/lib/libwayland-server.so*  || true
          rm -f AppDir/usr/lib/libxkbcommon.so*       || true
          rm -f AppDir/usr/lib/libxkbcommon-x11.so*   || true
          rm -f AppDir/usr/lib/libEGL.so*             || true
          rm -f AppDir/usr/lib/libGL.so*              || true
          rm -f AppDir/usr/lib/libGLX.so*             || true
          rm -f AppDir/usr/lib/libGLdispatch.so*      || true
          rm -f AppDir/usr/lib/libvulkan.so*          || true
          rm -f AppDir/usr/lib/libpulse.so*           || true
          rm -f AppDir/usr/lib/libpulsecommon*.so     || true

      - name: Build AppImage
        run: |
          curl -fL --retry 5 --retry-delay 3 -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          test -s appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir kute-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-appimage
          path: kute-x86_64.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            Write-Error "NSIS install failed"
            exit 1
          }

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-qt6-quickdialogs
            mingw-w64-ucrt-x86_64-qt6-quicklayouts
            mingw-w64-ucrt-x86_64-qt6-quickcontrols2
            mingw-w64-ucrt-x86_64-qt6-shadertools
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-imageformats

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Deploy Qt DLLs
        run: |
          mkdir -p dist
          cp build/kute.exe dist/
          windeployqt --release --no-translations --qmldir qml dist/kute.exe || true
          cp /ucrt64/bin/*.dll dist/

          rm -f dist/ggml*.dll
          rm -f dist/libllama*.dll
          rm -f dist/libmtmd*.dll
          rm -f dist/libwhisper*.dll
          rm -f dist/libparakeet*.dll
          rm -f dist/libpython*.dll
          rm -f dist/libPyImath*.dll
          rm -f dist/libopenblas*.dll
          rm -f dist/libgfortran*.dll
          rm -f dist/libquadmath*.dll
          rm -f dist/libgomp*.dll
          rm -f dist/tcl86.dll
          rm -f dist/tk86.dll
          rm -f dist/libhwy*.dll
          rm -f dist/libcaca*.dll
          rm -f dist/libImath*.dll
          rm -f dist/libIex*.dll
          rm -f dist/libIlmThread*.dll
          rm -f dist/libOpenEXR*.dll
          rm -f dist/libjxl*.dll
          rm -f dist/libmenuw6.dll
          rm -f dist/libformw6.dll
          rm -f dist/libpanelw6.dll
          rm -f dist/libncurses*.dll
          rm -f dist/vulkan-1.dll
          rm -f dist/OpenCL.dll

      - name: Ensure QML modules present
        run: |
          echo "=== Checking what windeployqt copied ==="
          if [ ! -d dist/qml ]; then
            echo "No qml folder — copying manually"
            mkdir -p dist/qml
            cp -r /ucrt64/share/qt6/qml/* dist/qml/ 2>/dev/null || \
            cp -r /ucrt64/lib/qt6/qml/* dist/qml/ 2>/dev/null || true
          fi

          echo "=== Available qml modules ==="
          ls dist/qml/ || echo "qml folder missing"

          echo "=== Ensuring critical modules exist ==="
          for mod in QtQuick QtQuick/Layouts QtQuick/Dialogs QtQuick/Controls QtQuick/Window; do
            src=""
            if [ -d "/ucrt64/share/qt6/qml/$mod" ]; then
              src="/ucrt64/share/qt6/qml/$mod"
            elif [ -d "/ucrt64/lib/qt6/qml/$mod" ]; then
              src="/ucrt64/lib/qt6/qml/$mod"
            fi

            if [ -n "$src" ] && [ ! -d "dist/qml/$mod" ]; then
              echo "Copying missing: $mod from $src"
              mkdir -p "dist/qml/$(dirname $mod)"
              cp -r "$src" "dist/qml/$mod"
            fi
          done

          echo "=== Final qml tree (top level) ==="
          ls dist/qml/

      - name: Ensure FFmpeg multimedia plugin present
        run: |
          mkdir -p dist/multimedia

          PLUGIN=""
          if [ -f /ucrt64/lib/qt6/plugins/multimedia/ffmpegmediaplugin.dll ]; then
            PLUGIN="/ucrt64/lib/qt6/plugins/multimedia/ffmpegmediaplugin.dll"
          elif [ -f /ucrt64/share/qt6/plugins/multimedia/ffmpegmediaplugin.dll ]; then
            PLUGIN="/ucrt64/share/qt6/plugins/multimedia/ffmpegmediaplugin.dll"
          fi

          if [ -n "$PLUGIN" ]; then
            echo "Copying FFmpeg plugin from $PLUGIN"
            cp "$PLUGIN" dist/multimedia/
          else
            echo "ERROR: ffmpegmediaplugin.dll not found!"
            find /ucrt64 -name 'ffmpegmediaplugin*' 2>/dev/null || true
          fi

          echo "=== Also ensure av* dlls are next to plugin ==="
          cp /ucrt64/bin/avcodec-*.dll dist/multimedia/ 2>/dev/null || true
          cp /ucrt64/bin/avformat-*.dll dist/multimedia/ 2>/dev/null || true
          cp /ucrt64/bin/avutil-*.dll dist/multimedia/ 2>/dev/null || true
          cp /ucrt64/bin/swresample-*.dll dist/multimedia/ 2>/dev/null || true
          cp /ucrt64/bin/swscale-*.dll dist/multimedia/ 2>/dev/null || true

          echo "=== contents of dist/multimedia ==="
          ls -la dist/multimedia/

      - name: Copy FFmpeg and dependencies
        run: |
          cp /ucrt64/bin/avcodec-*.dll dist/
          cp /ucrt64/bin/avformat-*.dll dist/
          cp /ucrt64/bin/avutil-*.dll dist/
          cp /ucrt64/bin/swresample-*.dll dist/
          cp /ucrt64/bin/swscale-*.dll dist/
          cp /ucrt64/bin/libjxl.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/libjxl_threads.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/libsoxr.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/libgomp-1.dll dist/ 2>/dev/null || true

      - name: Copy OpenSSL legacy provider
        run: |
          mkdir -p dist/lib/ossl-modules
          cp /ucrt64/lib/ossl-modules/legacy.dll dist/lib/ossl-modules/ 2>/dev/null || true
          cp /ucrt64/bin/libcrypto-3-x64.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/libssl-3-x64.dll dist/ 2>/dev/null || true

      - name: Show final dist size and key contents
        run: |
          echo "=== dist size ==="
          du -sh dist/
          echo "=== key files present ==="
          ls -la dist/kute.exe
          ls dist/multimedia/ 2>/dev/null | head -5
          ls dist/qml/QtQuick/ 2>/dev/null | head -20
          echo "=== qml total size ==="
          du -sh dist/qml/ 2>/dev/null

      - name: Build single exe with NSIS
        shell: bash
        run: |
          NSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ ! -f "$NSIS" ]; then exit 1; fi

          printf '%s\n' \
            'Unicode true' \
            'SilentInstall silent' \
            'RequestExecutionLevel user' \
            'OutFile "kute-windows-x86_64.exe"' \
            'InstallDir "$TEMP\kute"' \
            '' \
            'Section' \
            'InitPluginsDir' \
            'SetOutPath $PLUGINSDIR' \
            'File /r "dist\*"' \
            'ExecWait '"'"'"$PLUGINSDIR\kute.exe"'"'"'' \
            'SectionEnd' \
            > kute.nsi

          cat kute.nsi
          "$NSIS" kute.nsi

          if [ ! -f "kute-windows-x86_64.exe" ]; then exit 1; fi
          echo "=== final exe size ==="
          ls -la kute-windows-x86_64.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-portable
          path: kute-windows-x86_64.exe

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: downloads/

      - name: Delete existing v0.99 release if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.99 --repo ${{ github.repository }} --yes --cleanup-tag 2>/dev/null || true

      - name: Create pre-release v0.99
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.99
          name: "v0.99 (pre-release)"
          body: |
            Auto-generated build from commit ${{ github.sha }}.
            Updated on every workflow run.
          draft: false
          prerelease: true
          make_latest: false
          files: |
            downloads/linux-appimage/kute-x86_64.AppImage
            downloads/windows-portable/kute-windows-x86_64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
