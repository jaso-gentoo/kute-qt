name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libtag1-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev \
            cmake ninja-build patchelf desktop-file-utils \
            libfuse2 wget curl file

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

      - name: Build
        run: cmake --build build

      - name: Install to AppDir
        run: DESTDIR=$PWD/AppDir cmake --install build

      - name: Download linuxdeploy
        run: |
          set -e
          for i in 1 2 3; do
            curl -fL --retry 5 --retry-delay 3 --retry-connrefused \
              -o linuxdeploy-x86_64.AppImage \
              "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" && break || sleep 5
          done
          for i in 1 2 3; do
            curl -fL --retry 5 --retry-delay 3 --retry-connrefused \
              -o linuxdeploy-plugin-qt-x86_64.AppImage \
              "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage" && break || sleep 5
          done
          test -s linuxdeploy-x86_64.AppImage
          test -s linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Bundle Qt Wayland plugins and libs
        run: |
          QTDIR="${QT_ROOT_DIR:-$Qt6_DIR/../../..}"
          mkdir -p AppDir/usr/plugins/platforms
          mkdir -p AppDir/usr/plugins/wayland-shell-integration
          mkdir -p AppDir/usr/plugins/wayland-decoration-client
          mkdir -p AppDir/usr/plugins/wayland-graphics-integration-client
          mkdir -p AppDir/usr/lib

          cp -v "$QTDIR"/plugins/platforms/libqwayland*.so AppDir/usr/plugins/platforms/
          cp -v "$QTDIR"/plugins/wayland-shell-integration/*.so \
                AppDir/usr/plugins/wayland-shell-integration/ 2>/dev/null || true
          cp -v "$QTDIR"/plugins/wayland-decoration-client/*.so \
                AppDir/usr/plugins/wayland-decoration-client/ 2>/dev/null || true
          cp -v "$QTDIR"/plugins/wayland-graphics-integration-client/*.so \
                AppDir/usr/plugins/wayland-graphics-integration-client/ 2>/dev/null || true
          cp -v "$QTDIR"/lib/libQt6Wayland*.so* AppDir/usr/lib/

      - name: Fill AppDir with linuxdeploy
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
          EXTRA_QT_MODULES: "multimedia;dbus"
        run: |
          QTDIR="${QT_ROOT_DIR:-$Qt6_DIR/../../..}"
          export LD_LIBRARY_PATH="$QTDIR/lib:$LD_LIBRARY_PATH"
          export PATH="$QTDIR/bin:$PATH"

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --desktop-file AppDir/usr/share/applications/kute.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/kute.png

          rm -f AppDir/usr/lib/libwayland-client.so*  || true
          rm -f AppDir/usr/lib/libwayland-cursor.so*  || true
          rm -f AppDir/usr/lib/libwayland-egl.so*     || true
          rm -f AppDir/usr/lib/libwayland-server.so*  || true
          rm -f AppDir/usr/lib/libxkbcommon.so*       || true
          rm -f AppDir/usr/lib/libxkbcommon-x11.so*   || true
          rm -f AppDir/usr/lib/libEGL.so*             || true
          rm -f AppDir/usr/lib/libGL.so*              || true
          rm -f AppDir/usr/lib/libGLX.so*             || true
          rm -f AppDir/usr/lib/libGLdispatch.so*      || true
          rm -f AppDir/usr/lib/libvulkan.so*          || true
          rm -f AppDir/usr/lib/libpulse.so*           || true
          rm -f AppDir/usr/lib/libpulsecommon*.so     || true

      - name: Build AppImage
        run: |
          curl -fL --retry 5 --retry-delay 3 -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          test -s appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir kute-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-appimage
          path: kute-x86_64.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            Write-Error "NSIS install failed"
            exit 1
          }

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-qt6-shadertools
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-imageformats

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Locate Qt directories
        run: |
          echo "=== QML source dir candidates ==="
          for d in /ucrt64/share/qt6/qml /ucrt64/lib/qt6/qml; do
            if [ -d "$d" ]; then
              echo "EXISTS: $d"
              ls -la "$d" | head -5
            else
              echo "MISSING: $d"
            fi
          done

          echo ""
          echo "=== plugin source dir candidates ==="
          for d in /ucrt64/share/qt6/plugins /ucrt64/lib/qt6/plugins; do
            if [ -d "$d" ]; then
              echo "EXISTS: $d"
              ls "$d"
            else
              echo "MISSING: $d"
            fi
          done

          echo ""
          echo "=== check if qml files are symlinks ==="
          find /ucrt64 -name 'qmldir' -path '*QtQuick/Layouts*' -exec ls -la {} \; 2>/dev/null | head -3

      - name: Prepare dist with Qt DLLs
        run: |
          mkdir -p dist
          cp build/kute.exe dist/

          echo "=== copying all ucrt64 DLLs (following symlinks) ==="
          cp -L /ucrt64/bin/*.dll dist/

          rm -f dist/ggml*.dll
          rm -f dist/libllama*.dll
          rm -f dist/libmtmd*.dll
          rm -f dist/libwhisper*.dll
          rm -f dist/libparakeet*.dll
          rm -f dist/libpython*.dll
          rm -f dist/libPyImath*.dll
          rm -f dist/libopenblas*.dll
          rm -f dist/libgfortran*.dll
          rm -f dist/libquadmath*.dll
          rm -f dist/libgomp*.dll
          rm -f dist/tcl86.dll
          rm -f dist/tk86.dll
          rm -f dist/libhwy*.dll
          rm -f dist/libcaca*.dll
          rm -f dist/libImath*.dll
          rm -f dist/libIex*.dll
          rm -f dist/libIlmThread*.dll
          rm -f dist/libOpenEXR*.dll
          rm -f dist/libjxl*.dll
          rm -f dist/libmenuw6.dll
          rm -f dist/libformw6.dll
          rm -f dist/libpanelw6.dll
          rm -f dist/libncurses*.dll
          rm -f dist/vulkan-1.dll
          rm -f dist/OpenCL.dll

          echo "=== dll count ==="
          ls dist/*.dll | wc -l

      - name: Copy QML modules with symlink dereferencing
        run: |
          QML_SRC=""
          for cand in /ucrt64/share/qt6/qml /ucrt64/lib/qt6/qml; do
            if [ -d "$cand" ]; then
              QML_SRC="$cand"
              break
            fi
          done

          if [ -z "$QML_SRC" ]; then
            echo "ERROR: QML source not found"
            exit 1
          fi

          echo "Using: $QML_SRC"
          rm -rf dist/qml
          mkdir -p dist/qml

          echo "=== copying with -rL (dereference symlinks) ==="
          cp -rL "$QML_SRC"/* dist/qml/ 2>&1 | head -20 || true

          echo ""
          echo "=== check critical modules exist as real files ==="
          for m in QtQuick QtQuick/Layouts QtQuick/Controls QtQuick/Dialogs QtQuick/Window QtQml; do
            if [ -d "dist/qml/$m" ]; then
              echo "OK dir: $m"
              ls "dist/qml/$m" | head -3
            else
              echo "MISSING: $m"
            fi
          done

          echo ""
          echo "=== verify qmldir is a real file ==="
          ls -la dist/qml/QtQuick/Layouts/qmldir 2>&1 || echo "qmldir missing!"
          ls -la dist/qml/QtQuick/Layouts/*.dll 2>&1 | head -3 || echo "no dll in Layouts!"

          echo ""
          echo "=== total qml size ==="
          du -sh dist/qml/

      - name: Copy Qt plugins with symlink dereferencing
        run: |
          PLUG_SRC=""
          for cand in /ucrt64/share/qt6/plugins /ucrt64/lib/qt6/plugins; do
            if [ -d "$cand" ]; then
              PLUG_SRC="$cand"
              break
            fi
          done

          if [ -z "$PLUG_SRC" ]; then
            echo "ERROR: plugin source not found"
            exit 1
          fi

          echo "Using: $PLUG_SRC"
          ls "$PLUG_SRC"

          for sub in platforms imageformats iconengines multimedia styles generic networkinformation tls; do
            if [ -d "$PLUG_SRC/$sub" ]; then
              echo "Copying: $sub"
              mkdir -p "dist/$sub"
              cp -rL "$PLUG_SRC/$sub"/* "dist/$sub/" 2>&1 | head -5 || true
            fi
          done

          echo ""
          echo "=== dist/platforms ==="
          ls -la dist/platforms/ 2>/dev/null || echo "NO platforms"

          echo "=== dist/multimedia ==="
          ls -la dist/multimedia/ 2>/dev/null || echo "NO multimedia"

          echo "=== dist/imageformats ==="
          ls dist/imageformats/ 2>/dev/null || echo "NO imageformats"

      - name: Create qt.conf
        shell: bash
        run: |
          printf '%s\n' \
            '[Paths]' \
            'Prefix=./' \
            'Plugins=./' \
            'Qml2Imports=./qml' \
            > dist/qt.conf

          echo "=== dist/qt.conf ==="
          cat dist/qt.conf

      - name: Copy extra deps for multimedia
        run: |
          # av* DLLs next to exe AND in multimedia/ folder
          for dll in avcodec avformat avutil swresample swscale; do
            cp /ucrt64/bin/${dll}-*.dll dist/ 2>/dev/null || true
            cp /ucrt64/bin/${dll}-*.dll dist/multimedia/ 2>/dev/null || true
          done
          cp /ucrt64/bin/libjxl*.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/libsoxr.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/libgomp-1.dll dist/ 2>/dev/null || true

          mkdir -p dist/lib/ossl-modules
          cp /ucrt64/lib/ossl-modules/legacy.dll dist/lib/ossl-modules/ 2>/dev/null || true
          cp /ucrt64/bin/libcrypto-3-x64.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/libssl-3-x64.dll dist/ 2>/dev/null || true

      - name: Final check before NSIS
        run: |
          echo "=== dist size ==="
          du -sh dist/

          echo ""
          echo "=== key files ==="
          ls -la dist/kute.exe
          ls -la dist/Qt6Core.dll 2>/dev/null || echo "MISSING Qt6Core.dll"
          ls -la dist/qt.conf
          ls -la dist/platforms/qwindows.dll 2>/dev/null || echo "MISSING qwindows.dll"
          ls -la dist/multimedia/ 2>/dev/null | head -5
          ls -la dist/qml/QtQuick/Layouts/qmldir 2>/dev/null || echo "MISSING Layouts qmldir"

          echo ""
          echo "=== check for broken symlinks (should be empty) ==="
          find dist/ -xtype l 2>/dev/null || true

      - name: Build single exe with NSIS
        shell: bash
        run: |
          NSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ ! -f "$NSIS" ]; then exit 1; fi

          printf '%s\n' \
            'Unicode true' \
            'SilentInstall silent' \
            'RequestExecutionLevel user' \
            'OutFile "kute-windows-x86_64.exe"' \
            'InstallDir "$TEMP\kute"' \
            '' \
            'Section' \
            'InitPluginsDir' \
            'SetOutPath $PLUGINSDIR' \
            'File /r "dist\*"' \
            'ExecWait '"'"'"$PLUGINSDIR\kute.exe"'"'"'' \
            'SectionEnd' \
            > kute.nsi

          cat kute.nsi
          "$NSIS" kute.nsi

          if [ ! -f "kute-windows-x86_64.exe" ]; then exit 1; fi
          echo "=== final exe size ==="
          ls -la kute-windows-x86_64.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-portable
          path: kute-windows-x86_64.exe

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: downloads/

      - name: Delete existing v0.99 release if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.99 --repo ${{ github.repository }} --yes --cleanup-tag 2>/dev/null || true

      - name: Create pre-release v0.99
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.99
          name: "v0.99 (pre-release)"
          body: |
            Auto-generated build from commit ${{ github.sha }}.
            Updated on every workflow run.
          draft: false
          prerelease: true
          make_latest: false
          files: |
            downloads/linux-appimage/kute-x86_64.AppImage
            downloads/windows-portable/kute-windows-x86_64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
