name: Update Release Notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (оставь пустым для автоопределения последнего релиза)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto-detect latest release (if version is empty)
        id: get_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
            echo "Auto-detected latest tag: $LATEST_TAG"
            echo "version=$LATEST_TAG" >> $GITHUB_OUTPUT
          else
            echo "Using provided version: ${{ github.event.inputs.version }}"
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog section
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          
          version = os.environ["VERSION"].strip()
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8-sig")

          # Исправленная регулярка: ищем заголовок и захватываем всё до следующего ##
          pattern = re.compile(rf"^##\s+{re.escape(version)}(?=\s|$).*?$", re.MULTILINE)
          m = pattern.search(text)
          
          if not m:
              print(f"::warning::No changelog section found for {version}")
              body = f"_No changelog entry for {version}._"
          else:
              start = m.start()
              rest = text[m.end():]
              next_h = re.search(r"^##\s+", rest, re.MULTILINE)
              end = m.end() + (next_h.start() if next_h else len(rest))
              body = text[start:end].strip()

          out = pathlib.Path("release_body.md")
          out.write_text(body + "\n\n---\n"
              f"Build from commit `{os.environ['GITHUB_SHA']}`.\n"
              f"Version embedded in binary: `{version}`\n",
              encoding="utf-8")
          print(f"Successfully extracted changelog for {version}")
          PY
        env:
          VERSION: ${{ steps.get_version.outputs.version }}

      - name: Update GitHub Release Body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ steps.get_version.outputs.version }}" \
            --repo ${{ github.repository }} \
            --notes-file release_body.md